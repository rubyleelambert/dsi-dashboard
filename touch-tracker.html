  .num-blue { color: #63b3ed; }
  .num-purple { color: #b794f4; }
  .controls { padding: 0 24px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .controls input, .controls select { background: #1a1f2e; border: 1px solid #2d3748; color: #e2e8f0; border-radius: 6px; padding: 7px 12px; font-size: 13px; }

  table { width: calc(100% - 48px); margin: 0 24px 40px; border-collapse: collapse; font-size: 13px; }
  thead th { background: #1a1f2e; padding: 10px 12px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #718096; border-bottom: 1px solid #2d3748; white-space: nowrap; cursor: pointer; }
  thead th:hover { color: #e2e8f0; }
  tbody tr { border-bottom: 1px solid #1a2035; transition: background .1s; cursor: pointer; }
  tbody tr:hover { background: #1a1f2e; }
  td { padding: 9px 12px; vertical-align: top; }
  .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .b-new       { background: #2d3748; color: #a0aec0; }
  .b-emailed   { background: #1a365d; color: #63b3ed; }
  .b-replied   { background: #1c4532; color: #68d391; }
  .b-interview { background: #44337a; color: #b794f4; }
  .b-offer     { background: #744210; color: #f6ad55; }
  .b-dead      { background: #742a2a; color: #fc8181; }
  .b-hold      { background: #3d2b1e; color: #ed8936; }
  .urgency { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .urg-red    { background: #fc8181; box-shadow: 0 0 6px #fc8181; }
  .urg-yellow { background: #f6ad55; box-shadow: 0 0 6px #f6ad55; }
  .urg-green  { background: #68d391; }
  .urg-grey   { background: #4a5568; }
  .days-col { font-weight: 600; white-space: nowrap; }
  .days-hot { color: #fc8181; }
  .days-warm { color: #f6ad55; }
  .days-ok { color: #68d391; }
  .days-new { color: #718096; }
  .touch-dots { display: flex; gap: 4px; flex-wrap: wrap; }
  .dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
  .dot-sent { background: #1a365d; color: #63b3ed; border: 1px solid #2b6cb0; }
  .dot-reply { background: #1c4532; color: #68d391; border: 1px solid #276749; }
  .dot-empty { background: #1a1f2e; border: 1px dashed #2d3748; }
  .name-cell { font-weight: 600; color: #fff; }
  .company-cell { font-size: 11px; color: #718096; }

  .modal-footer { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

// Touch history stored separately
let touches = JSON.parse(localStorage.getItem('dsi_touches') || '{}');
let candidates = JSON.parse(localStorage.getItem('dsi_candidates') || 'null') || BASE;
let editId = null;

function save() {
  localStorage.setItem('dsi_candidates', JSON.stringify(candidates));
  localStorage.setItem('dsi_touches', JSON.stringify(touches));
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  return Math.floor((Date.now() - new Date(dateStr)) / 86400000);
}

function getLastTouch(id) {
  const th = touches[id];
  if (!th || !th.length) return null;
  return th[th.length - 1].date;
}

function urgencyOf(c) {
  if (['dead','offer'].includes(c.status)) return 'grey';
  if (c.status === 'new') return 'grey';
  const lt = getLastTouch(c.id) || c.added;
  const d = daysSince(lt);
  if (d === null) return 'grey';
  if (d >= 14) return 'red';
  if (d >= 7)  return 'yellow';
  return 'green';
}

function touchDots(id, status) {
  const th = touches[id] || [];
  const max = 5;
  const dots = [];
  for (let i = 0; i < max; i++) {
    if (i < th.length) {
      const t = th[i];
      const cls = t.replied ? 'dot-reply' : 'dot-sent';
      const lbl = t.replied ? 'R' : (i + 1);
      dots.push(`<div class="dot ${cls}" title="${t.date}: ${t.method}">${lbl}</div>`);
    } else {
      dots.push(`<div class="dot dot-empty"></div>`);
    }
  }
  return `<div class="touch-dots">${dots.join('')}</div>`;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('status-filter').value;
  const uf = document.getElementById('urgency-filter').value;
  const sort = document.getElementById('sort-by').value;

  const urgMap = { red: 0, yellow: 1, green: 2, grey: 3 };

  let list = candidates.filter(c =>
    (!q || c.name.toLowerCase().includes(q) || c.company.toLowerCase().includes(q) || c.email.toLowerCase().includes(q)) &&
    (!sf || c.status === sf) &&
    (!uf || (uf === 'overdue' && urgencyOf(c) === 'red') ||
            (uf === 'due' && urgencyOf(c) === 'yellow') ||
            (uf === 'ok' && urgencyOf(c) === 'green'))
  );

  if (sort === 'urgency') list.sort((a,b) => urgMap[urgencyOf(a)] - urgMap[urgencyOf(b)]);
  else if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  else list.sort((a,b) => (b.added || '').localeCompare(a.added || ''));

  // Stats (from full list)
  const all = candidates;
  document.getElementById('st-total').textContent = all.filter(c => !['dead'].includes(c.status)).length;
  document.getElementById('st-overdue').textContent = all.filter(c => urgencyOf(c) === 'red').length;
  document.getElementById('st-due').textContent = all.filter(c => urgencyOf(c) === 'yellow').length;
  document.getElementById('st-replied').textContent = all.filter(c => c.status === 'replied').length;
  document.getElementById('st-interview').textContent = all.filter(c => c.status === 'interview').length;
  document.getElementById('st-dead').textContent = all.filter(c => c.status === 'dead').length;

  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleString();

  const tbody = document.getElementById('tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#4a5568;padding:30px;">No candidates match filters</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(c => {
    const urg = urgencyOf(c);
    const sm = STATUS_META[c.status] || STATUS_META.new;
    const lt = getLastTouch(c.id);
    const d = lt ? daysSince(lt) : null;
    let daysTxt = '', daysCls = 'days-new';
    if (d !== null) {
      daysTxt = d === 0 ? 'Today' : d + 'd ago';
      daysCls = d >= 14 ? 'days-hot' : d >= 7 ? 'days-warm' : 'days-ok';
    } else if (c.status === 'emailed') {
      daysTxt = 'No date';
      daysCls = 'days-hot';
    }

    const nextAction = c.status === 'interview' ? '📅 Interview scheduled' :
                       c.status === 'replied'   ? '📞 Follow up now' :
                       c.status === 'dead'      ? '—' :
                       urg === 'red'            ? '⚡ Send follow-up' :
                       urg === 'yellow'         ? '📧 Follow up soon' :
                       c.status === 'new'       ? '📤 Send outreach' : '✅ Recent';

    return `<tr onclick="openEdit(${c.id})">
      <td><span class="urgency urg-${urg}"></span></td>
      <td style="color:#4a5568;font-size:11px;">${c.num}</td>
      <td><div class="name-cell">${c.name}</div><div class="company-cell">${c.email || '—'}</div></td>
      <td><div class="name-cell" style="font-size:12px;">${c.company}</div><div class="company-cell">${c.title}</div></td>
      <td><span class="badge ${sm.cls}">${sm.label}</span></td>
      <td>${touchDots(c.id, c.status)}</td>
      <td class="days-col ${daysCls}">${daysTxt}</td>
      <td style="font-size:12px;color:#a0aec0;">${nextAction}</td>
    </tr>`;
  }).join('');
}

function openEdit(id) {
  editId = id;
  const c = candidates.find(x => x.id === id);
  if (!c) return;
  const th = touches[id] || [];
  document.getElementById('modal-name').textContent = c.name;
  document.getElementById('modal-meta').textContent = `${c.company} · ${c.title} · ${c.email || 'No email on file'}`;

  const statusOpts = Object.entries(STATUS_META).map(([k,v]) =>
    `<option value="${k}" ${c.status===k?'selected':''}>${v.label}</option>`
  ).join('');

  const touchHistory = th.length ? th.map(t =>
    `<div class="touch-item">
      <span class="t-date">${t.date}</span>
      <span class="t-method">${t.method}</span>
      ${t.replied ? '<span class="badge b-replied" style="margin-left:6px;">Replied</span>' : ''}
      ${t.note ? `<div class="t-note">${t.note}</div>` : ''}
    </div>`
  ).join('') : '<div style="color:#4a5568;font-size:12px;">No touches recorded yet.</div>';

  document.getElementById('modal-body').innerHTML = `
    <label>Status</label>
    <select id="m-status">${statusOpts}</select>
    <label>Notes</label>
    <textarea id="m-notes">${c.notes || ''}</textarea>

    <label style="margin-top:18px;">Touch History</label>
    <div class="touch-history">${touchHistory}</div>

    <div class="add-touch-form">
      <h4>Log a Touch</h4>
      <div class="touch-row">
        <input type="date" id="t-date" value="${new Date().toISOString().slice(0,10)}">
        <select id="t-method">
          <option>Email</option><option>LinkedIn</option><option>Phone</option><option>Text</option><option>In Person</option>
        </select>
        <select id="t-replied">
          <option value="0">No Reply</option>
          <option value="1">Got a Reply</option>
        </select>
      </div>
      <input id="t-note" placeholder="Note (optional)" style="width:100%;margin-top:8px;">
      <button class="btn btn-primary" style="margin-top:10px;width:100%;" onclick="logTouch()">Log Touch</button>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}

function logTouch() {
  if (!editId) return;
  const t = {
    date:    document.getElementById('t-date').value,
    method:  document.getElementById('t-method').value,
    replied: document.getElementById('t-replied').value === '1',
    note:    document.getElementById('t-note').value.trim(),
  };
  if (!touches[editId]) touches[editId] = [];
  touches[editId].push(t);
  // Update status if got a reply
  if (t.replied) {
    const idx = candidates.findIndex(x => x.id === editId);
    if (candidates[idx].status === 'emailed') candidates[idx].status = 'replied';
  }
  save();
  openEdit(editId); // refresh modal
  render();
}

function saveModal() {
  const idx = candidates.findIndex(x => x.id === editId);
  candidates[idx].status = document.getElementById('m-status').value;
  candidates[idx].notes = document.getElementById('m-notes').value;
  save(); closeModalDirect(); render();
}

function closeModal(e) { if (e.target === document.getElementById('modal')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal').classList.remove('open'); editId = null; }

render();
setInterval(render, 60000); // refresh every minute
</script>
</body>
</html>
